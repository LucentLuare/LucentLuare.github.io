<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ongeki Style Mobile Rhythm</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; background: #111; display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; touch-action: none;
    }
    #game-container {
      width: 100vw; max-width: 56.25vh;
      height: 100vh; max-height: 177.78vw;
      background: #0b0b16; display: flex; flex-direction: column; border: 2px solid #333;
    }
    #play-area { flex: 68; position: relative; width: 100%; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }
    
    #controller-area {
      flex: 32; background: #16213e; display: flex; flex-direction: column; padding: 6px; gap: 6px;
      border-top: 2px solid #e94560;
    }
    #slider-track {
      flex: 25; background: #0f3460; border-radius: 10px; position: relative; border: 2px solid #e94560;
      overflow: hidden;
    }
    #slider-knob {
      width: 48px; height: 100%; background: #e94560; border-radius: 8px;
      position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none;
      display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: bold;
    }
    #button-grid {
      flex: 75; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
    }
    .btn {
      background: #1e1e24; border: 2px solid #555; border-radius: 6px; color: white;
      display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 11px;
      transition: background-color 0.05s, box-shadow 0.05s;
    }
    .btn-side { background: #2c163b; border-color: #b53471; color: #f8a5c2; }
    .btn-side.active { background: #b53471; border-color: #fff; color: #fff; box-shadow: 0 0 10px #b53471; }
    .btn-red { background: #3b1419; border-color: #ff4757; color: #ff6b81; }
    .btn-red.active { background: #ff4757; border-color: #fff; color: #fff; box-shadow: 0 0 10px #ff4757; }
    .btn-green { background: #113320; border-color: #2ed573; color: #7bed9f; }
    .btn-green.active { background: #2ed573; border-color: #fff; color: #111; box-shadow: 0 0 10px #2ed573; }
    .btn-blue { background: #102542; border-color: #1e90ff; color: #70a1ff; }
    .btn-blue.active { background: #1e90ff; border-color: #fff; color: #fff; box-shadow: 0 0 10px #1e90ff; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="play-area">
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="controller-area">
    <div id="slider-track">
      <div id="slider-knob">◀ ▶</div>
    </div>
    <div id="button-grid">
      <div class="btn btn-side" data-key="0">L-S</div>
      <div class="btn btn-red" data-key="1">1</div>
      <div class="btn btn-green" data-key="2">2</div>
      <div class="btn btn-blue" data-key="3">3</div>
      <div class="btn btn-red" data-key="4">4</div>
      <div class="btn btn-green" data-key="5">5</div>
      <div class="btn btn-blue" data-key="6">6</div>
      <div class="btn btn-side" data-key="7">R-S</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const sliderTrack = document.getElementById('slider-track');
  const sliderKnob = document.getElementById('slider-knob');
  const buttons = document.querySelectorAll('.btn');

  function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let playerX = 0.5;
  let sliderPointerId = null;
  let lastTouchX = 0;
  const SLIDER_SENSITIVITY = 1.25;

  // ★ 노트 속도 조절 변수 (터치와 완전히 독립됨)
  const NOTE_SPEED = 0.0055; 

  sliderTrack.addEventListener('pointerdown', (e) => {
    if (sliderPointerId === null) {
      sliderPointerId = e.pointerId;
      lastTouchX = e.clientX;
      sliderTrack.setPointerCapture(e.pointerId);
    }
  });

  sliderTrack.addEventListener('pointermove', (e) => {
    if (e.pointerId === sliderPointerId) {
      const rect = sliderTrack.getBoundingClientRect();
      const deltaX = e.clientX - lastTouchX;
      lastTouchX = e.clientX;

      const deltaRatio = (deltaX / rect.width) * SLIDER_SENSITIVITY;
      playerX = Math.max(0.06, Math.min(0.94, playerX + deltaRatio));
      sliderKnob.style.left = `${playerX * 100}%`;
    }
  });

  const endSliderTouch = (e) => {
    if (e.pointerId === sliderPointerId) sliderPointerId = null;
  };
  sliderTrack.addEventListener('pointerup', endSliderTouch);
  sliderTrack.addEventListener('pointercancel', endSliderTouch);

  buttons.forEach(btn => {
    btn.addEventListener('pointerdown', () => btn.classList.add('active'));
    const release = () => btn.classList.remove('active');
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  let testBricks = [
    { progress: 0.1, lane: 1, color: '#2ed573' }, 
    { progress: 0.4, lane: 0, color: '#ff4757' }, 
    { progress: 0.7, lane: 2, color: '#1e90ff' }  
  ];

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const topY = 0;
    const judgeY = canvas.height * 0.90;     
    const topWidth = canvas.width * 0.20;    
    const bottomWidth = canvas.width * 0.80; 
    const centerX = canvas.width / 2;

    function getTrackMetrics(y) {
      const p = Math.max(0, Math.min(1, (y - topY) / (judgeY - topY)));
      const currentWidth = topWidth + (bottomWidth - topWidth) * p;
      return {
        left: centerX - currentWidth / 2,
        right: centerX + currentWidth / 2,
        width: currentWidth
      };
    }

    const topM = getTrackMetrics(topY);
    const bottomM = getTrackMetrics(judgeY);

    // 트랙 배경
    ctx.fillStyle = 'rgba(15, 15, 30, 0.85)';
    ctx.beginPath();
    ctx.moveTo(topM.left, topY);
    ctx.lineTo(topM.right, topY);
    ctx.lineTo(bottomM.right, judgeY);
    ctx.lineTo(bottomM.left, judgeY);
    ctx.closePath();
    ctx.fill();

    // 트랙 내부 가로 격자선
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 1;
    const gridCount = 10;
    for (let i = 0; i <= gridCount; i++) {
      let gridProg = (Date.now() * 0.0005 * (NOTE_SPEED * 200) + i / gridCount) % 1.0;
      let gY = topY + (judgeY - topY) * gridProg;
      let gm = getTrackMetrics(gY);
      
      ctx.beginPath();
      ctx.moveTo(gm.left, gY);
      ctx.lineTo(gm.right, gY);
      ctx.stroke();
    }

    // 트랙 외곽 경계선
    ctx.strokeStyle = '#b53471';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(topM.left, topY);
    ctx.lineTo(bottomM.left, judgeY);
    ctx.moveTo(topM.right, topY);
    ctx.lineTo(bottomM.right, judgeY);
    ctx.stroke();

    // ★ 벽돌 노트 렌더링 (세로 두께 유지 + 가로 크기를 레인의 1/8 수준으로 밀착)
    testBricks.forEach(brick => {
      brick.progress += NOTE_SPEED; 
      if (brick.progress > 1.0) brick.progress = 0.0;

      const brickHeight = 20; // 노트의 세로 두께 고정
      const currentY = topY + (judgeY - topY) * brick.progress;
      
      const m = getTrackMetrics(currentY);
      const laneWidth = m.width / 3;
      
      // 해당 레인의 중앙 X 좌표
      const laneCenterX = m.left + laneWidth * brick.lane + laneWidth / 2;
      
      // 노트의 가로 폭을 레인 너비의 1/8 (또는 적절한 비율)로 고정하여 밀집감 부여
      const brickWidth = laneWidth * (7 / 8); 

      const x1 = laneCenterX - brickWidth / 2;
      const x2 = laneCenterX + brickWidth / 2;
      const y1 = currentY - brickHeight;
      const y2 = currentY;

      // 벽돌 본체
      ctx.fillStyle = brick.color;
      ctx.fillRect(x1, y1, brickWidth, brickHeight);

      // 벽돌 테두리
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(x1, y1, brickWidth, brickHeight);

      // ★ 노트 중앙의 수평(가로) 하얀색 하이라이트 라인
      const halfY = y1 + brickHeight * 0.5;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x1 + 4, halfY);
      ctx.lineTo(x2 - 4, halfY);
      ctx.stroke();
    });

    // 판정선
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(bottomM.left, judgeY);
    ctx.lineTo(bottomM.right, judgeY);
    ctx.stroke();

    // 캐릭터
    const charX = playerX * canvas.width;
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.arc(charX, judgeY, 16, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(charX, judgeY, 5, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
